<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>만능 랜덤 뽑기 & 팀 짜기</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .tab-btn.active {
            border-bottom-color: #4F46E5;
            color: #4F46E5;
            font-weight: 700;
        }
        .slot-animation {
            transition: all 0.1s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col text-slate-800">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-black flex items-center gap-2">
                <i data-lucide="dices" class="w-7 h-7"></i> 만능 랜덤 뽑기 & 팀 짜기
            </h1>
            <div class="flex items-center gap-2">
                <!-- 사용 방법 매뉴얼 버튼 -->
                <button onclick="openManualModal()" class="bg-indigo-500 hover:bg-indigo-400 text-white px-3.5 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1.5 shadow-sm transition-all border border-indigo-400">
                    <i data-lucide="help-circle" class="w-4 h-4"></i> 사용 방법
                </button>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 flex space-x-8 overflow-x-auto">
            <button onclick="switchTab('groups')" id="tab-groups" class="tab-btn active py-4 px-2 border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2 transition-all whitespace-nowrap">
                <i data-lucide="users" class="w-4 h-4"></i> 참가자/그룹 관리
            </button>
            <button onclick="switchTab('teams')" id="tab-teams" class="tab-btn py-4 px-2 border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2 transition-all whitespace-nowrap">
                <i data-lucide="user-plus" class="w-4 h-4"></i> 랜덤 팀 짜기
            </button>
            <button onclick="switchTab('roulette')" id="tab-roulette" class="tab-btn py-4 px-2 border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2 transition-all whitespace-nowrap">
                <i data-lucide="pie-chart" class="w-4 h-4"></i> 룰렛 돌리기
            </button>
            <button onclick="switchTab('ladder')" id="tab-ladder" class="tab-btn py-4 px-2 border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2 transition-all whitespace-nowrap">
                <i data-lucide="git-merge" class="w-4 h-4"></i> 사다리 타기
            </button>
            <button onclick="switchTab('single')" id="tab-single" class="tab-btn py-4 px-2 border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2 transition-all whitespace-nowrap">
                <i data-lucide="trophy" class="w-4 h-4"></i> 단일/다중 추첨
            </button>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
